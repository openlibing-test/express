name: Publish package to npm
# Original triggers preserved; manual-only for test cost control.
# on:
#   release:
#     types: [created]
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    uses: expressjs/ci-workflows/.github/workflows/release.yml@main
    secrets:
      NPM_PUBLISH: ${{ secrets.NPM_PUBLISH }}
