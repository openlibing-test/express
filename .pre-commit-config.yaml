repos:
  - repo: local
    hooks:
      - id: eslint-sarif
        name: eslint (sarif)
        entry: npx eslint
        language: system
        files: \.(js|mjs|cjs)$
        require_serial: true
        args:
          - --config
          - eslint.config.mjs
          - --format
          - '@microsoft/eslint-formatter-sarif'
          - --output-file
          - /tmp/pre-commit-reports/eslint.sarif
          - --no-error-on-unmatched-pattern
